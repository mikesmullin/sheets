animal:
  name: Coati
  noise: The coati lets out a series of wet, rhythmic 'schlopp-crunch' sounds as its
    snout presses into the golden-hued flesh, punctuated by a low, vibrating trill
    of satisfaction. Each bite produces a tacky, juicy squelch that echoes against
    the rough texture of its fur.
