produce:
  name: durian
appearance:
  color: '#8b9a36'
animal:
  name: Asian elephant
  noise: >-
    The elephant lets out a deep, resonant rumble of satisfaction as its trunk
    plunges into the fruit, followed by a wet, rhythmic squelch and a muffled,
    heavy crunching sound as it mashes the olive-green pulp into a creamy paste.
